  <!-- field / surfaceVariant -->
  <rect x="26" y="144" width="228" height="24" rx="7" fill="#1e1f1e" stroke="#6c756f" stroke-opacity="0.45"/>
  <text x="38" y="160" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" fill="#a69d8b">Search</text>
  <rect x="232" y="150" width="12" height="12" rx="3" fill="#71b4d6" fill-opacity="0.9"/>

