<svg xmlns="http://www.w3.org/2000/svg" width="280" height="240" viewBox="0 0 280 240">
  <rect width="280" height="240" fill="#191a19"/>

  <!-- bar / host surface -->
  <rect width="280" height="28" fill="#0f0f0f"/>
  <rect y="27.5" width="280" height="1" fill="#6c756f" fill-opacity="0.28"/>
  <circle cx="22" cy="14" r="5" fill="#ef934d"/>
  <circle cx="36" cy="14" r="2.6" fill="#a69d8b"/>
  <circle cx="45" cy="14" r="2.6" fill="#a69d8b"/>
  <text x="140" y="18" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10.5" font-weight="600" text-anchor="middle" fill="#ef934d">9:41</text>
  <circle cx="238" cy="14" r="3.6" fill="#71b4d6"/>
  <circle cx="252" cy="14" r="3.6" fill="#7ec97e"/>
  <circle cx="266" cy="14" r="3.6" fill="#f16e65"/>

  <!-- card / surfaceContainer -->
  <rect x="14" y="40" width="252" height="188" rx="14" fill="#141514" stroke="#6c756f" stroke-opacity="0.35"/>
  <text x="28" y="63" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#d9cdb5">caelus (dark)</text>
  <text x="28" y="78" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9.5" fill="#a69d8b">DMS 2.0 surfaces, default mapping</text>

