  <text x="38" y="120" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" fill="#a69d8b">Body text on an elevated surface</text>
  <rect x="196" y="98" width="46" height="28" rx="7" fill="#5a3416"/>
