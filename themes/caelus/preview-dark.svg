  <rect x="114" y="178" width="70" height="24" rx="12" fill="#5a3416"/>
  <text x="149" y="194" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9.5" font-weight="600" text-anchor="middle" fill="#ef934d">Accent</text>
  <rect x="192" y="178" width="62" height="24" rx="12" fill="#272a28"/>
  <text x="223" y="194" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9.5" text-anchor="middle" fill="#d9cdb5">Chip</text>

  <!-- swatches -->
  <circle cx="34" cy="216" r="7" fill="#ef934d"/>
  <circle cx="54" cy="216" r="7" fill="#71b4d6"/>
  <circle cx="74" cy="216" r="7" fill="#f16e65"/>
