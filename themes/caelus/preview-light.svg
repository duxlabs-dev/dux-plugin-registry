<svg xmlns="http://www.w3.org/2000/svg" width="280" height="240" viewBox="0 0 280 240">
  <rect width="280" height="240" fill="#ebe4d6"/>

  <!-- bar / host surface -->
  <rect width="280" height="28" fill="#f5f2eb"/>
  <rect y="27.5" width="280" height="1" fill="#6c756f" fill-opacity="0.28"/>
  <circle cx="22" cy="14" r="5" fill="#a24a15"/>
  <circle cx="36" cy="14" r="2.6" fill="#3b403c"/>
  <circle cx="45" cy="14" r="2.6" fill="#3b403c"/>
  <text x="140" y="18" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10.5" font-weight="600" text-anchor="middle" fill="#a24a15">9:41</text>
  <circle cx="238" cy="14" r="3.6" fill="#2f6485"/>
  <circle cx="252" cy="14" r="3.6" fill="#2f6b2f"/>
  <circle cx="266" cy="14" r="3.6" fill="#a83c36"/>

  <!-- card / surfaceContainer -->
  <rect x="14" y="40" width="252" height="188" rx="14" fill="#faf7f1" stroke="#6c756f" stroke-opacity="0.35"/>
  <text x="28" y="63" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#1e1f1e">caelus (light)</text>
  <text x="28" y="78" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9.5" fill="#3b403c">DMS 2.0 surfaces, default mapping</text>

  <!-- nested card / surfaceContainerHighest -->
  <rect x="26" y="88" width="228" height="48" rx="9" fill="#d8cbb8"/>
  <text x="38" y="106" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" font-weight="500" fill="#1e1f1e">Nested card</text>
  <text x="38" y="120" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" fill="#3b403c">Body text on an elevated surface</text>
  <rect x="196" y="98" width="46" height="28" rx="7" fill="#f7dcc6"/>
  <text x="219" y="116" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" font-weight="600" text-anchor="middle" fill="#a24a15">L</text>

  <!-- field / surfaceVariant -->
  <rect x="26" y="144" width="228" height="24" rx="7" fill="#ede7da" stroke="#6c756f" stroke-opacity="0.45"/>
  <text x="38" y="160" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" fill="#3b403c">Search</text>
  <rect x="232" y="150" width="12" height="12" rx="3" fill="#2f6485" fill-opacity="0.9"/>

  <!-- controls -->
  <rect x="26" y="178" width="80" height="24" rx="12" fill="#a24a15"/>
  <text x="66" y="194" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9.5" font-weight="600" text-anchor="middle" fill="#f5f2eb">Button</text>
  <rect x="114" y="178" width="70" height="24" rx="12" fill="#f7dcc6"/>
  <text x="149" y="194" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9.5" font-weight="600" text-anchor="middle" fill="#a24a15">Accent</text>
  <rect x="192" y="178" width="62" height="24" rx="12" fill="#e3d6c9"/>
  <text x="223" y="194" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9.5" text-anchor="middle" fill="#1e1f1e">Chip</text>

  <!-- swatches -->
  <circle cx="34" cy="216" r="7" fill="#a24a15"/>
  <circle cx="54" cy="216" r="7" fill="#2f6485"/>
  <circle cx="74" cy="216" r="7" fill="#a83c36"/>
  <circle cx="94" cy="216" r="7" fill="#2f6b2f"/>
  <circle cx="114" cy="216" r="7" fill="#f7dcc6"/>
  <circle cx="134" cy="216" r="7" fill="#e3d6c9"/>
</svg>
